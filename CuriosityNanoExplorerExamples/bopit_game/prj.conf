# Bop It! game - merged from the ambient_light, capacitive_touch, joystick_oled,
# potentiometer_reading, proximity_sensor, temperature_sensor, rgb_ring,
# snake_game and microphone (branch `microphone`) examples.

# Explorer I2C bus: OLED, MCP23008 (joystick + touch pads), VCNL4200, MCP9808
CONFIG_I2C=y
CONFIG_GPIO=y

# Potentiometer (AIN7) and microphone (AIN6) on the same SAM ADC
CONFIG_ADC=y

# OLED through the character framebuffer. The CFB allocates its 1 KiB frame
# buffer from the heap (examples used 2048..8192; 4096 is a compromise that
# still fits the 16 KiB SRAM of the SAMD21G17D).
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# WS2812B RGB ring (bit-banged GPIO driver, see rgb_ring example)
CONFIG_LED_STRIP=y

# Random instruction selection (same as snake_game). The timer based
# generator is not cryptographic; the game also mixes in the cycle counter
# at the moment the player starts a game.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048

# NOTE: the capacitive_touch example used CONFIG_INPUT / CONFIG_INPUT_GPIO_KEYS
# with the MCP23008 GPIO driver. The game reads the MCP23008 directly instead
# (like joystick_oled / snake_game), so those options are intentionally NOT set.
# See README "Conflicts and how they were resolved".

# Audio extension (not implemented). When implementing the speaker path from
# the `speaker` example, add:
#   CONFIG_SPI=y
#   CONFIG_DAC=y
