# Board-specific Kconfig for same51_cnano, merged from the per-example settings.
# SAME51J20A: 1 MiB flash, 256 KiB SRAM - room for audio samples later.
# More heap is harmless here:
CONFIG_HEAP_MEM_POOL_SIZE=8192
# None of the examples used a board .conf; all options live in prj.conf.
# Board-only tweaks go here so prj.conf stays identical for every board.
#
# Example (from the joystick_oled README troubleshooting): if the Microchip
# "g1" SERCOM I2C driver in your tree is too old, update the checkout.
#
# Audio extension (speaker example), when implemented:
# CONFIG_SPI=y
# CONFIG_DAC=y
# CONFIG_DAC_LOG_LEVEL_INF=y
