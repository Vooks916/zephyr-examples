# SD card over SPI: SPI bus -> SDHC SPI driver -> SD/MMC disk
CONFIG_SPI=y
CONFIG_DISK_ACCESS=y

# FAT file system on the "SD" disk
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Never format the card if mounting fails (for example an exFAT card)
CONFIG_FS_FATFS_MOUNT_MKFS=n

CONFIG_MAIN_STACK_SIZE=2048
