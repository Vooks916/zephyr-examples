# I2C bus (SERCOM0 on PA00/PA01 -> Explorer I2C bus)
CONFIG_I2C=y

# OLED (SSD1306 driver is pulled in automatically from the devicetree node)
CONFIG_DISPLAY=y

# Console output over the Nano Debugger virtual COM port
CONFIG_PRINTK=y

# PL10 only has 8 KB SRAM - keep things lean
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_LOG=n
